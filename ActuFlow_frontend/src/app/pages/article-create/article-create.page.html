<ion-header class="editor-header"><ion-toolbar><ion-buttons slot="start"><ion-back-button defaultHref="/my-articles"></ion-back-button></ion-buttons><ion-title><ion-icon name="create-outline"></ion-icon> {{ articleId ? 'Modifier l’article' : 'Nouvel article' }}</ion-title><ion-button slot="end" fill="clear" (click)="cancel()"><ion-icon name="close-outline" slot="start"></ion-icon>Quitter</ion-button></ion-toolbar></ion-header>
<ion-content><main class="editor-shell"><header class="editor-heading"><p class="eyebrow">Mode rédaction</p><h1>Donnez forme à votre idée.</h1><p>Écrivez en Markdown. Vous pourrez continuer à modifier le brouillon avant sa soumission.</p></header><section class="editor-panel"><ion-input class="title-input" [(ngModel)]="form.titre" placeholder="Titre de l’article"></ion-input><ion-textarea class="summary-input" [(ngModel)]="form.resume" placeholder="Résumé court (optionnel)" autoGrow="true" maxlength="300"></ion-textarea><ion-textarea class="content-input" [(ngModel)]="form.contenu" placeholder="Commencez à écrire en Markdown..." autoGrow="true" minlength="20"></ion-textarea><div class="editor-settings"><label class="file-picker">Image de une<input type="file" accept="image/*" (change)="selectImage($event)"></label><ion-select [(ngModel)]="form.id_categorie" interface="popover" placeholder="Catégorie"><ion-select-option *ngFor="let category of categories" [value]="category.id_categorie">{{ category.nom }}</ion-select-option></ion-select></div><div class="editor-actions"><ion-button fill="outline" (click)="save('Brouillon')" [disabled]="isSaving || !form.titre.trim() || !form.contenu.trim()">Enregistrer le brouillon</ion-button><ion-button class="submit-button" (click)="save('En attente')" [disabled]="isSaving || !form.titre.trim() || !form.contenu.trim()">Soumettre pour validation</ion-button></div></section></main></ion-content>
